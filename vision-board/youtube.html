<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YouTube Research — Vision Board</title>
<style>
:root{
  --bg:#f6f5f3; --panel:#ffffff; --panel2:#fbfaf8; --fg:#1d1b19; --mut:#6f6a64; --faint:#a39e97;
  --line:#e6e2dc; --acc:#e8590c; --acc-soft:#fff1e8; --ok:#2f9e44; --bad:#c92a2a;
  --t1:#d9480f; --t2:#f76707; --t3:#f59f00; --t0:#868e96;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05); --r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --panel:#1d1b1a; --panel2:#232120; --fg:#f1efec; --mut:#a8a29b; --faint:#6f6a64;
  --line:#2f2c2a; --acc:#ff7a33; --acc-soft:#33221a; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);
  display:grid;grid-template-columns:248px 1fr;min-height:100vh}
a{color:inherit;text-decoration:none} button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)} .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)} .btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 9px;font-size:12.5px} .btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--bad)}
input[type=text],input[type=search],textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;font-size:15px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:#fff}
.side-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 18px 6px;font-weight:600}
.ws-list{padding:0 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.ws:hover{background:var(--panel2)} .ws.active{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.ws .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;overflow:hidden}
.ws .av img{width:100%;height:100%;object-fit:cover}
.ws .nm{font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws .meta{font-size:12px;color:var(--mut)}
.add-ws{margin:6px 10px;justify-content:center;border-style:dashed;color:var(--mut)}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px} .bar>i{display:block;height:100%;background:var(--acc)}

/* main */
main{min-width:0;display:flex;flex-direction:column}
.top{padding:20px 28px 0;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top .who{display:flex;gap:14px;align-items:center;min-width:0;flex:1}
.top .big-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;overflow:hidden;flex:none}
.top .big-av img{width:100%;height:100%;object-fit:cover}
.top h1{margin:0;font-size:21px;line-height:1.2;display:flex;align-items:center;gap:8px}
.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
.top .sub a{color:var(--acc)}
.top .act{display:flex;gap:8px;align-items:center}
.job{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:4px;padding:16px 28px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;border:none;background:none;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--fg)} .tab.active{color:var(--fg);border-bottom-color:var(--acc)}
.tab .ct{font-size:11.5px;background:var(--line);border-radius:10px;padding:0 7px;color:var(--mut);font-weight:600}
.tab.active .ct{background:var(--acc);color:#fff}

.filters{display:grid;grid-template-columns:minmax(220px,1.4fr) repeat(4,minmax(140px,1fr)) auto;gap:14px 18px;padding:16px 28px;align-items:end;
  background:var(--panel2);border-bottom:1px solid var(--line)}
.f label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.f label b{color:var(--fg);text-transform:none;letter-spacing:0;font-size:12.5px}
.search{position:relative} .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:32px}
input[type=range]{width:100%;accent-color:var(--acc);height:20px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;padding:7px 11px;color:var(--mut);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--fg);color:var(--bg)}
.row2{display:flex;gap:10px;align-items:center;padding:12px 28px 0;flex-wrap:wrap;color:var(--mut);font-size:13px}
.row2 select{width:auto;padding:5px 8px}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--mut)}
.chipbtn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:18px;padding:16px 28px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--faint)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--line);display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;color:#fff;font-weight:800;font-size:13px;padding:3px 8px;border-radius:7px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.badge svg{width:13px;height:13px;stroke-width:2.5}
.b1{background:var(--t1)} .b2{background:var(--t2)} .b3{background:var(--t3)} .b0{background:var(--t0)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.shorttag{position:absolute;right:8px;top:8px;background:#ff0033;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px}
.savedtag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#ffd43b;padding:2px 5px;border-radius:5px;display:flex}
.cb{padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.ttl{font-weight:650;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ttl:hover{color:var(--acc)}
.chan{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;min-width:0}
.chan img,.chan .ph{width:20px;height:20px;border-radius:50%;flex:none;background:var(--line)}
.chan span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.st{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--mut);white-space:nowrap}
.st b{color:var(--fg);font-weight:650}
.st.up b{color:var(--ok)} .st.down b{color:var(--bad)}
.acts{display:flex;gap:4px;margin-top:auto;padding-top:4px;border-top:1px dashed var(--line)}
.acts .btn{padding:5px 8px;font-size:12.5px;color:var(--mut)} .acts .btn:hover{color:var(--fg)}
.acts .btn.on{color:#e67700}
.acts .sp{flex:1}

.empty{padding:70px 28px;text-align:center;color:var(--mut)}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:17px}
.empty .btn{margin-top:14px}

/* channels tab */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 28px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.box h3{margin:0 0 4px;font-size:15px} .box p{margin:0 0 12px;color:var(--mut);font-size:13px}
.box textarea{min-height:92px;resize:vertical}
.inl{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--faint)}
.ctable{margin:0 28px 40px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ctable .hd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ctable .hd h3{margin:0;font-size:15px;flex:1}
.ctable .hd input{max-width:260px}
.crow{display:grid;grid-template-columns:36px minmax(0,2.2fr) 1fr 1fr 1fr 1.2fr 90px;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none} .crow.h{font-size:11.5px;color:var(--faint);text-transform:uppercase;font-weight:600;letter-spacing:.04em;padding:8px 14px}
.crow img,.crow .ph{width:36px;height:36px;border-radius:50%;background:var(--line)}
.crow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .crow .hdl{font-size:12px;color:var(--mut)}
.crow .num{font-variant-numeric:tabular-nums}

/* trends */
.trends{padding:18px 28px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.trend{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;box-shadow:var(--shadow)}
.trend:hover{border-color:var(--acc)}
.trend .p{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;gap:8px}
.trend .p span{color:var(--acc);font-size:13px}
.trend .m{font-size:12.5px;color:var(--mut);margin:3px 0 6px}
.trend .e{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,100vw);background:var(--panel);z-index:21;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dr-h .sp{flex:1}
.dr-b{overflow:auto;padding:16px 18px 30px}
.dr-b h2{margin:12px 0 4px;font-size:18px;line-height:1.3}
.dr-b .thumb{border-radius:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.m{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.m .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.m .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.m .x{font-size:11.5px;color:var(--faint)}
.script{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px;line-height:1.6;max-height:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,94vw);background:var(--panel);border-radius:14px;z-index:22;padding:20px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.on{display:block}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .fld{margin-bottom:12px} .modal .fld label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.modal .fld .hint{font-size:12px;color:var(--faint);margin-top:4px}
.modal .ft{display:flex;gap:8px;margin-top:16px} .modal .ft .sp{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:30;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw}

/* my videos */
.sumbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 28px 0}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.sum .k{font-size:11.5px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.sum .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.sum .x{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvlist{padding:16px 28px 40px;display:flex;flex-direction:column;gap:12px}
.mv{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);align-items:start}
.mv .thumb{border-radius:8px}
.mv h4{margin:0 0 6px;font-size:15px;line-height:1.3}
.mv .orig{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.mv .orig .row{display:flex;gap:8px;align-items:center}
.mv .orig img{width:72px;border-radius:5px;aspect-ratio:16/9;object-fit:cover;flex:none}
.mv .orig .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 8px}
.pill.good{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.pill.neutral{background:var(--line);color:var(--mut)}
/* compare */
.cmpg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.cmpg .col h5{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.cmpg .col .thumb{border-radius:8px}
.cmpg .col .tt{font-weight:650;margin:8px 0 2px;line-height:1.3}
.ctab{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.ctab td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ctab td:first-child{color:var(--mut)} .ctab td:not(:first-child){text-align:right;font-weight:600;width:30%}
.ctab td.win{color:var(--ok)}
.verdict{border-radius:10px;padding:12px 14px;font-weight:600;margin-top:14px}
.verdict.good{background:color-mix(in srgb,var(--ok) 13%,transparent)} .verdict.bad{background:color-mix(in srgb,var(--bad) 11%,transparent)}
.verdict.neutral{background:var(--panel2);border:1px solid var(--line)}
.sug{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sug .ar{flex:none;width:118px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding-top:2px}
.sug .lv{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.lv.high{background:var(--bad)} .lv.medium{background:var(--t2)} .lv.low{background:var(--t3)} .lv.check,.lv.info{background:var(--faint)}
.hooks{display:grid;grid-template-columns:1fr 1fr;gap:10px} .hooks .script{font-size:12.5px}
/* production */
.howto{margin:16px 28px 0;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:var(--r);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.howto code{background:var(--panel);padding:1px 6px;border-radius:4px;font-size:12.5px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;padding:16px 28px 40px;overflow-x:auto}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:200px}
.kcol h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow)}
.kcard .thumb{aspect-ratio:16/9}
.kcard .kb{padding:9px 10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.kcard .kt{font-weight:650;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard .nt{color:var(--mut);font-style:italic}
.kcard .ka{display:flex;gap:4px;flex-wrap:wrap}
.fmt{font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:4px;padding:1px 6px;background:var(--fg);color:var(--bg)}
.fmt.short{background:#ff0033;color:#fff}

@media (max-width:1100px){.mv{grid-template-columns:160px 1fr}.mv .orig{grid-column:1/-1}.sumbar{grid-template-columns:1fr 1fr}}
@media (max-width:1100px){.filters{grid-template-columns:1fr 1fr 1fr}.filters .search{grid-column:1/-1}}
@media (max-width:820px){
  body{grid-template-columns:1fr} aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .ws-list{flex-direction:row;overflow-x:auto;padding-bottom:8px} .ws{flex:none} .side-foot{display:none}
  .cols{grid-template-columns:1fr} .filters{grid-template-columns:1fr 1fr}
  .crow{grid-template-columns:36px 1fr 80px 70px} .crow .hide-m{display:none}
  .top,.tabs,.filters,.row2,.grid,.trends{padding-left:16px;padding-right:16px} .ctable{margin:0 16px 30px}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></div>YouTube Research</div>
  <a class="btn" href="/board.html" style="margin:0 10px 8px;justify-content:center;font-weight:600">← Back to CEO Dashboard</a>
  <div class="side-label">Your channels</div>
  <div class="ws-list" id="wsList"></div>
  <button class="btn add-ws" id="addWs"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a channel</button>
  <div class="side-foot">
    <div style="display:flex;justify-content:space-between"><span>YouTube API today</span><b id="qText">–</b></div>
    <div class="bar"><i id="qBar" style="width:0"></i></div>
    <div>Resets midnight Pacific</div>
    <div id="sched" style="margin-top:10px"></div>
    <button class="btn ghost small" style="margin-top:10px;padding-left:0;color:var(--mut)" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login.html')">Sign out</button>
  </div>
</aside>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"></div>

<script>
const I = {
  fire:'<path d="M12 2c1 3 4 5 4 9a4 4 0 0 1-8 0c0-2 1-3 1-3s-3 1-3 5a6 6 0 0 0 12 0c0-6-6-8-6-11z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  star:'<path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',

const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24">${I[n]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { if (n == null || n === '') return '–'; n = +n; const a = Math.abs(n);
  return a >= 1e9 ? (n/1e9).toFixed(1)+'B' : a >= 1e6 ? (n/1e6).toFixed(1)+'M' : a >= 1e4 ? Math.round(n/1e3)+'K' : a >= 1e3 ? (n/1e3).toFixed(1)+'K' : Math.round(n)+''; };
const x1 = n => n == null ? '–' : (n >= 100 ? Math.round(n) : n >= 10 ? n.toFixed(0) : n.toFixed(1)) + '×';
const ago = iso => { if (!iso) return 'never'; const s = (Date.now() - new Date(iso)) / 1000;
  return s < 90 ? 'just now' : s < 3600 ? Math.round(s/60)+'m ago' : s < 86400 ? Math.round(s/3600)+'h ago' : Math.round(s/86400)+'d ago'; };
const age = d => d < 1 ? Math.max(1, Math.round(d*24))+'h' : d < 60 ? Math.round(d)+'d' : Math.round(d/30)+'mo';
const dur = s => { if (!s) return ''; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const tier = v => v >= 20 ? 'b1' : v >= 8 ? 'b2' : v >= 3 ? 'b3' : 'b0';
const initials = s => (s||'?').split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();

async function api(path, opts = {}) {
  const [p, qs] = path.split('?');
  const r = await fetch('/api/yt?r=' + encodeURIComponent(p) + (qs ? '&' + qs : ''), { method: opts.method || 'GET',
    headers: {'Content-Type':'application/json'}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { location.href = '/login.html'; throw new Error('Signed out'); }
  const j = await r.json().catch(() => ({ error: 'Bad response' }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Refresh runs from the browser in small batches so each server call stays short; progress shows in the header.
async function refreshIds(ids, label = 'Refreshing') {
  if (!ids || !ids.length) return;
  if (st.job.running) return toast('A refresh is already running');
  st.job = { running: true, message: `${label} 0/${ids.length} channels` }; renderJob();
  let done = 0, err = null;
  try {
    for (let i = 0; i < ids.length; i += 8) {
      await api('/refresh', { method: 'POST', body: { channel_ids: ids.slice(i, i + 8) } });
      done = Math.min(ids.length, i + 8);
      st.job.message = `${label} ${done}/${ids.length} channels`; renderJob();
    }
  } catch (e) { err = e.message; }
  st.job = { running: false };
  toast(err ? `Stopped after ${done} channels: ${err}` : `Updated ${done} channel(s)`, err ? 6000 : 3000);
  await loadState(); await loadTab();
}
function toast(msg, ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

// slider scales (log where it helps)
const S = {
  mult: { to: s => Math.pow(10, s/100*2), from: v => Math.log10(v)/2*100, show: v => v <= 1.01 ? 'Any' : x1(v) },
  subs: { to: s => s >= 100 ? Infinity : Math.pow(10, 3 + s/100*4), from: v => v === Infinity ? 100 : (Math.log10(v)-3)/4*100, show: v => v === Infinity ? 'Any' : '≤ ' + fmt(v) },
  views:{ to: s => s <= 0 ? 0 : Math.pow(10, 2 + s/100*5), from: v => v <= 0 ? 0 : (Math.log10(v)-2)/5*100, show: v => v <= 0 ? 'Any' : '≥ ' + fmt(v) },
  age:  { to: s => +s, from: v => v, show: v => v >= 90 ? 'Any' : '≤ ' + v + ' days' },
};
const TAB_DEFAULTS = {
  explode:  { minMult: 1, maxAge: 14, sort: 'explode_score' },
  outliers: { minMult: 3, maxAge: 30, sort: 'multiplier' },
  saved:    { minMult: 1, maxAge: 90, sort: 'saved' },
};
const SORTS = [['explode_score','Explode score'],['multiplier','Outlier ×'],['age_adj_multiplier','Age-adjusted ×'],
  ['views','Views'],['views_per_sub','Views per sub'],['momentum','Momentum'],['recent_vph','Views/hour now'],['newest','Newest'],['engagement','Engagement']];

const st = {

  chQ: '', loading: false, my: null, prod: [], schedule: {}, queued: 0,
};
const ws = () => st.workspaces.find(w => w.id === st.wsId);

// ------------------------------------------------------------------ data
async function loadState() {
  const s = await api('/state');
  st.workspaces = s.workspaces; st.quota = s.quota; st.queued = s.queued_scripts; st.pending = s.pending_transcripts;
  if (!ws() && st.workspaces.length) st.wsId = st.workspaces[0].id;
  renderSide(); renderJob();
}
async function loadTab() {
  const w = ws(); if (!w) return render();
  st.loading = true; render();
  try {
    if (st.tab === 'channels') st.channels = (await api(`/workspaces/${w.id}/channels`)).channels;
    else if (st.tab === 'trends') st.topics = (await api(`/workspaces/${w.id}/topics?days=30`)).topics;
    else if (st.tab === 'myvideos') { st.my = await api(`/workspaces/${w.id}/myvideos`); if (st.my.refresh) setTimeout(() => refreshIds(st.my.refresh, 'Pulling your videos'), 50); }
    else if (st.tab === 'production') st.prod = (await api(`/production?workspace=${w.id}`)).items;
    else { const r = await api(`/workspaces/${w.id}/videos?days=90`); st.videos = r.videos; st.transcripts = new Set(r.has_transcript); }
  } catch (e) { toast(e.message); }
  st.loading = false; render();
}
function setTab(t) {
  st.tab = t; localStorage.tab = t;
  if (TAB_DEFAULTS[t]) Object.assign(st.f, TAB_DEFAULTS[t]);
  loadTab();
}
function setWs(id) { st.wsId = id; localStorage.wsId = id; renderSide(); loadTab(); }

// ------------------------------------------------------------------ filtering
function filtered(forTab = st.tab) {
  const f = st.f, q = f.q.trim().toLowerCase();
  let v = st.videos.filter(x =>
    (f.showHidden || !x.hidden) &&
    (f.format === 'both' || (f.format === 'short') === x.is_short) &&
    x.age_days <= (f.maxAge >= 90 ? 1e9 : f.maxAge) &&
    (x.subs || 0) <= f.maxSubs && x.views >= f.minViews && x.multiplier >= f.minMult &&
    (!q || (x.title + ' ' + (x.channel || '') + ' ' + (x.handle || '')).toLowerCase().includes(q)));
  if (forTab === 'explode') v = v.filter(x => x.explode_score != null && x.explode_score >= 1.5 && x.median_views >= 200);
  if (forTab === 'outliers') v = v.filter(x => x.median_views >= 200);
  if (forTab === 'saved') v = st.videos.filter(x => x.saved && (!q || x.title.toLowerCase().includes(q)));
  const k = f.sort;
  const val = x => k === 'newest' ? -x.age_days : k === 'saved' ? x.multiplier : (x[k] ?? -1);
  return v.sort((a, b) => val(b) - val(a));
}
function counts() {
  const save = st.tab; return { explode: filtered('explode').length, outliers: filtered('outliers').length, saved: st.videos.filter(x => x.saved).length };
}

function mvRow(v) {

  else if (v.suggested_original) right = `<div class="orig"><div style="font-weight:700;font-size:11.5px;color:var(--mut);text-transform:uppercase">Looks like a remake of</div>

  return `<div class="mv"><a class="thumb" href="${esc(v.url)}" target="_blank"><img src="${esc(v.thumb || v.hq_thumb)}" alt="" loading="lazy"><span class="dur">${dur(v.duration)}</span>${v.is_short ? '<span class="shorttag">SHORT</span>' : ''}</a>

async function openCompare(mine, orig, scripts = false) {
  const d = document.getElementById('drawer');
  d.innerHTML = `<div class="dr-h"><b>Yours vs the original</b><span class="sp"></span><button class="btn ghost" onclick="closeAll()">${ic('x')}</button></div>
    <div class="dr-b"><div class="job"><div class="spin"></div>${scripts ? 'Pulling both scripts…' : 'Comparing…'}</div></div>`;
  d.classList.add('on'); document.getElementById('scrim').classList.add('on'); document.getElementById('modal').classList.remove('on');
  let c; try { c = await api(`/compare?mine=${mine}&orig=${orig}&scripts=${scripts ? 1 : 0}`); }
  catch (e) { d.querySelector('.dr-b').innerHTML = `<div class="note" style="color:var(--bad)">${esc(e.message)}</div>`; return; }
  const m = c.mine, o = c.original;
  const row = (label, a, b, better) => { const win = better == null ? '' : better > 0 ? 'b' : better < 0 ? 'a' : '';
    return `<tr><td>${label}</td><td class="${win === 'a' ? 'win' : ''}">${a}</td><td class="${win === 'b' ? 'win' : ''}">${b}</td></tr>`; };
  const cmpN = (a, b) => (a == null || b == null) ? null : Math.sign(b - a);
  const col = (v, label) => `<div class="col"><h5>${label}</h5><a class="thumb" href="${esc(v.url)}" target="_blank"><img src="${esc(v.hq_thumb)}" alt=""><span class="dur">${dur(v.duration)}</span></a>
    <div class="tt">${esc(v.title)}</div><div class="note">${esc(v.channel || '')} · ${fmt(v.subs)} subs</div></div>`;
  const t = c.title, s = c.script;
  let scriptHtml = `<button class="btn" onclick="openCompare('${mine}','${orig}',true)">${ic('file')}Compare the scripts</button>
    <div class="note" style="margin-top:6px">Pulls captions for both videos: word count, speaking pace, how much wording overlaps, and the two hooks side by side.</div>`;
  if (s) {
    const sm = s.mine || {}, so = s.original || {};
    scriptHtml = `<table class="ctab"><tr><td></td><td>Original</td><td>Yours</td></tr>
      ${row('Words', fmt(so.words), fmt(sm.words))}${row('Words per minute', so.wpm ?? '–', sm.wpm ?? '–', cmpN(so.wpm, sm.wpm))}
      ${s.similarity != null ? `<tr><td>Wording shared with the original</td><td colspan="2">${Math.round(s.similarity * 100)}%</td></tr>` : ''}</table>
      ${so.error || sm.error ? `<div class="note">${esc(so.error || '')} ${esc(sm.error || '')}</div>` : ''}
      <div class="hooks"><div><h5 style="margin:6px 0">Original hook (first ~30s)</h5><div class="script">${esc(so.hook || '–')}</div></div>
      <div><h5 style="margin:6px 0">Your hook</h5><div class="script">${esc(sm.hook || '–')}</div></div></div>`;
  }
  d.querySelector('.dr-b').innerHTML = `
    <div class="verdict ${c.verdict.tone}">${esc(c.verdict.text)}</div>
    <div class="cmpg">${col(o, 'Original')}${col(m, 'Yours')}</div>
    <table class="ctab"><tr><td></td><td>Original</td><td>Yours</td></tr>
      ${row('Views now', fmt(o.views), fmt(m.views))}
      ${row(`Views at ${age(m.age_days)} old <span class="note">(original estimated)</span>`, fmt(c.original_views_at_my_age), fmt(m.views), cmpN(c.original_views_at_my_age, m.views))}
      ${row('vs its channel\'s typical video', x1(o.multiplier), x1(m.multiplier), cmpN(o.multiplier, m.multiplier))}
      ${row('vs typical at the same age', x1(o.age_adj), x1(m.age_adj), cmpN(o.age_adj, m.age_adj))}
      ${row('Engagement (likes + comments)', (o.engagement ?? '–') + '%', (m.engagement ?? '–') + '%', cmpN(o.engagement, m.engagement))}
      ${row('Like rate', (o.like_rate ?? '–') + '%', (m.like_rate ?? '–') + '%', cmpN(o.like_rate, m.like_rate))}
      ${row('Comment rate', (o.comment_rate ?? '–') + '%', (m.comment_rate ?? '–') + '%', cmpN(o.comment_rate, m.comment_rate))}
      ${row('Length', dur(o.duration), dur(m.duration))}
      ${row('Title length', t.orig_len + ' chars', t.mine_len + ' chars')}
      ${row('Channel size', fmt(o.subs), fmt(m.subs))}
    </table>
    <h3 style="font-size:15px;margin:18px 0 4px">What to improve</h3>
    ${c.suggestions.map(x => `<div class="sug"><i class="lv ${x.level}"></i><div class="ar">${esc(x.area)}</div><div>${esc(x.text)}</div></div>`).join('')}
    <h3 style="font-size:15px;margin:18px 0 6px">Titles</h3>
    <div class="note">Shared keywords: ${t.shared.length ? esc(t.shared.join(', ')) : 'none'}${t.missing_from_mine.length ? ` · In the original but not yours: <b>${esc(t.missing_from_mine.join(', '))}</b>` : ''}</div>
    <h3 style="font-size:15px;margin:18px 0 6px">Scripts</h3>${scriptHtml}
    <div class="note" style="margin-top:16px">Click-through rate and watch time aren't public on YouTube, so these suggestions work from views, engagement, titles and captions.</div>`;
}

function bindFilters() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  const refresh = () => { document.getElementById('content').innerHTML = contentHtml(); const c = counts();
    document.querySelectorAll('.tab .ct')[0] && (document.querySelectorAll('.tab .ct')[0].textContent = c.explode);
    document.querySelectorAll('.tab .ct')[1] && (document.querySelectorAll('.tab .ct')[1].textContent = c.outliers); };
  on('fq', 'input', e => { st.f.q = e.target.value; refresh(); });
  [['mult','minMult'],['age','maxAge'],['subs','maxSubs'],['views','minViews']].forEach(([k, key]) =>
    on('fs-' + k, 'input', e => { st.f[key] = S[k].to(+e.target.value); document.getElementById('lb-' + k).textContent = S[k].show(st.f[key]); refresh(); }));
  on('fsort', 'change', e => { st.f.sort = e.target.value; refresh(); });
  document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => { st.f.format = b.dataset.fmt; render(); });
  document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const p = b.dataset.preset;
    if (p === 'small') st.f.maxSubs = st.f.maxSubs === 100000 ? Infinity : 100000;
    if (p === 'hidden') st.f.showHidden = !st.f.showHidden;
    if (p === 'reset') Object.assign(st.f, { q: '', format: 'long', maxSubs: Infinity, minViews: 1000, showHidden: false }, TAB_DEFAULTS[st.tab] || {});
    render(); });
  on('chQ', 'input', e => { st.chQ = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('chQ'); el.focus(); el.setSelectionRange(pos, pos); });
  on('addBtn', 'click', addChannels);
  on('discBtn', 'click', discover);
  on('discQ', 'keydown', e => { if (e.key === 'Enter') discover(); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => removeChannel(b.dataset.rm));
  document.querySelectorAll('[data-phrase]').forEach(b => b.onclick = () => { setTab('outliers'); st.f.q = b.dataset.phrase; st.f.minMult = 1; });
}

}
async function removeChannel(id) {
  const c = st.channels.find(x => x.id === id);
  if (!confirm(`Stop following ${c ? c.title : id} in ${ws().name}?`)) return;
  try { await api(`/workspaces/${st.wsId}/channels/${id}`, { method: 'DELETE' }); st.channels = st.channels.filter(x => x.id !== id);
    ws().channel_count--; renderSide(); render(); } catch (e) { toast(e.message); }
}
async function toggleSave(id) {
  const v = st.videos.find(x => x.id === id); if (!v) return;
  try { await api(`/workspaces/${st.wsId}/${v.saved ? 'unsave' : 'saved'}`, { method: 'POST', body: { video_id: id } });
    v.saved = !v.saved; ws().saved_count += v.saved ? 1 : -1; renderSide(); render(); if (document.getElementById('drawer').classList.contains('on')) openVideo(id);
  } catch (e) { toast(e.message); }
}
async function toggleHide(id) {
  const v = st.videos.find(x => x.id === id); if (!v) return;
  try { await api(`/workspaces/${st.wsId}/${v.hidden ? 'unhide' : 'hide'}`, { method: 'POST', body: { video_id: id } });
    v.hidden = !v.hidden; toast(v.hidden ? 'Hidden from this channel’s feed' : 'Unhidden'); render(); } catch (e) { toast(e.message); }
}

// ------------------------------------------------------------------ drawer (video detail + script)
const scripts = {};
function openVideo(id, wantScript = false) {
  const v = st.videos.find(x => x.id === id); if (!v) return;
  const d = document.getElementById('drawer');
  const M = (k, val, x) => `<div class="m"><div class="k">${k}</div><div class="v">${val}</div>${x ? `<div class="x">${x}</div>` : ''}</div>`;
  d.innerHTML = `<div class="dr-h"><button class="btn ${v.saved ? 'on' : ''}" onclick="toggleSave('${v.id}')">${ic('star')}${v.saved ? 'Saved' : 'Save idea'}</button>
      <button class="btn" onclick="produceModal('${v.id}')">${ic('clap')}Send to production</button>
      <a class="btn" href="${esc(v.url)}" target="_blank">${ic('ext')}Watch</a><span class="sp"></span>
      <button class="btn ghost" onclick="closeAll()">${ic('x')}</button></div>
    <div class="dr-b">
      <a class="thumb" href="${esc(v.url)}" target="_blank"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="dur">${dur(v.duration)}</span></a>
      <h2>${esc(v.title)}</h2>
      <div class="chan" style="font-size:13.5px">${v.channel_thumb ? `<img src="${esc(v.channel_thumb)}" alt="">` : ''}<span>${esc(v.channel)} · ${fmt(v.subs)} subs · uploaded ${age(v.age_days)} ago</span></div>
      <div class="mgrid">
        ${M('Explode score', v.explode_score == null ? '–' : x1(v.explode_score), v.explode_score == null ? (v.age_days < .5 ? 'under 12h old' : 'older than 14 days') : 'age-adj × pace')}
        ${M('Outlier', x1(v.multiplier), 'vs typical ' + fmt(v.median_views))}
        ${M('Age-adjusted', x1(v.age_adj_multiplier), 'vs typical at this age')}
        ${M('Views', fmt(v.views), fmt(v.lifetime_vph) + '/hr average')}
        ${M('Pace now', v.recent_vph == null ? '–' : fmt(v.recent_vph) + '/hr', v.momentum == null ? 'needs 2 scans' : (v.momentum >= 1 ? 'speeding up ' : 'slowing ') + v.momentum.toFixed(2) + '×')}
        ${M('Views / sub', v.views_per_sub == null ? '–' : v.views_per_sub.toFixed(2), 'engagement ' + (v.engagement ?? '–') + '%')}
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:18px 0 8px"><h3 style="margin:0;font-size:15px;flex:1">Script</h3><span id="scrBtns"></span></div>
      <div id="scr"><button class="btn primary" onclick="loadScript('${v.id}')">${ic('file')}Get the script</button>
        <div class="note" style="margin-top:6px">Pulls the video's captions as text you can download and rewrite in your own words.</div></div>
    </div>`;
  d.classList.add('on'); document.getElementById('scrim').classList.add('on');
  if (wantScript || scripts[id] || st.transcripts.has(id)) loadScript(id);
}
async function loadScript(id) {
  const box = document.getElementById('scr'); if (!box) return;
  if (!scripts[id]) {
    box.innerHTML = `<div class="job"><div class="spin"></div>Fetching captions…</div>`;
    let r;
    try { r = await api(`/transcript/${id}`); }
    catch (e) { box.innerHTML = `<div class="note" style="color:var(--bad)">${esc(e.message)}</div>`; return; }
    if (r.error) { box.innerHTML = `<div class="note" style="color:var(--acc)">${esc(r.error)}</div>`; loadState(); return; }
    scripts[id] = r; st.transcripts.add(id);
  }
  const t = scripts[id];
  const words = t.text.split(/\s+/).length;
  box.innerHTML = `<div class="note" style="margin-bottom:8px">${fmt(words)} words · about ${Math.max(1, Math.round(words / 150))} min spoken${t.lang && !t.lang.startsWith('en') ? ' · language: ' + esc(t.lang) : ''}</div><div class="script">${esc(t.text)}</div>`;
  document.getElementById('scrBtns').innerHTML = `<button class="btn small" onclick="copyScript('${id}')">${ic('copy')}Copy</button>
    <button class="btn small primary" onclick="downloadScript('${id}')">${ic('dl')}Download .txt</button>`;
}
function scriptText(id) { const t = scripts[id]; return `${t.title}\n${t.channel}\n${t.url}\n\n${t.text}\n`; }
function copyScript(id) { navigator.clipboard.writeText(scriptText(id)).then(() => toast('Script copied')); }
function downloadScript(id) {
  const t = scripts[id], a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([scriptText(id)], { type: 'text/plain' }));
  a.download = (t.title || id).replace(/[\\/:*?"<>|]+/g, '').slice(0, 80) + '.txt'; a.click();
}

// ------------------------------------------------------------------ workspace modal
function wsModal(id) {
  const w = id ? st.workspaces.find(x => x.id === id) : null, m = document.getElementById('modal');
  m.innerHTML = `<h3>${w ? 'Edit channel' : 'Add one of your channels'}</h3>
    <div class="fld"><label>Name</label><input type="text" id="mName" value="${esc(w ? w.name : '')}" placeholder="e.g. Limitless Mortgages"></div>
    <div class="fld"><label>Your YouTube channel <span style="font-weight:400;color:var(--faint)">(optional)</span></label>
      <input type="text" id="mMine" value="${esc(w && w.my_channel ? (w.my_channel.handle || w.my_channel.id) : '')}" placeholder="@yourhandle or channel link">
      <div class="hint">Shows your subscriber count at the top.</div></div>
    <div class="fld"><label>Niche</label><input type="text" id="mNiche" value="${esc(w ? w.niche || '' : '')}" placeholder="e.g. Canadian mortgages, renewals, first-time buyers"></div>
    <div class="ft">${w ? `<button class="btn danger" onclick="deleteWs(${w.id})">${ic('trash')}Delete</button>` : ''}<span class="sp"></span>
      <button class="btn" onclick="closeAll()">Cancel</button><button class="btn primary" id="mSave">${w ? 'Save' : 'Add channel'}</button></div>`;
  m.classList.add('on'); document.getElementById('scrim').classList.add('on'); document.getElementById('mName').focus();
  document.getElementById('mSave').onclick = async () => {
    const body = { name: document.getElementById('mName').value, my_channel: document.getElementById('mMine').value, niche: document.getElementById('mNiche').value };
    try {
      let r;
      if (w) r = await api(`/workspaces/${w.id}`, { method: 'PATCH', body });
      else { r = await api('/workspaces', { method: 'POST', body }); st.wsId = r.id; localStorage.wsId = r.id; st.tab = 'channels'; }
      closeAll(); await loadState(); await loadTab(); await refreshIds(r.refresh, 'Pulling your channel');
    } catch (e) { toast(e.message); }
  };
}
async function deleteWs(id) {
  const w = st.workspaces.find(x => x.id === id);
  if (!confirm(`Delete “${w.name}”? Its followed-channel list and saved ideas will be removed. Scanned video data is kept.`)) return;
  await api(`/workspaces/${id}`, { method: 'DELETE' }); st.wsId = null; closeAll(); await loadState(); await loadTab();
}
function closeAll() { ['drawer', 'modal', 'scrim'].forEach(i => document.getElementById(i).classList.remove('on')); }

// ------------------------------------------------------------------ boot
if (TAB_DEFAULTS[st.tab]) Object.assign(st.f, TAB_DEFAULTS[st.tab]);
loadState().then(loadTab).catch(e => { document.getElementById('main').innerHTML = `<div class="empty"><h3>Can't reach the server</h3><div>${esc(e.message)}</div></div>`; });
setInterval(() => { if (!st.job.running) loadState(); }, 60000);
</script>
</body>
</html>
